title = "gitleaks config for llm-wiki"

[extend]
# Start from gitleaks' built-in ruleset (AWS keys, GitHub/GitLab tokens,
# Slack tokens, private keys, generic high-entropy secrets, etc.)
useDefault = true

[allowlist]
description = "Generated/lock files that are noisy for entropy-based rules but never hand-authored"
paths = [
  '''(^|/)package-lock\.json$''',
  '''(^|/)quartz\.lock\.json$''',
  '''(^|/)quartz/\.quartz-cache/.*''',
  # Vendored emoji code-point -> name data table (~15MB of plain text).
  # Never hand-authored, no secrets possible, but its size alone made
  # every gitleaks scan (pre-commit/pre-push/CI) take minutes longer.
  '''(^|/)quartz/util/emojimap\.json$''',
]
